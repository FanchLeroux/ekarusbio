[project]
name = "ekarusbio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fleroux", email = "francois.leroux.pro@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
]

[project.scripts]
ekarusbio = "ekarusbio:main"

[project.optional-dependencies]
gpu = [
    "cupy-cuda13x[ctk]>=14.2.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "pyside6>=6.11.2",
]
