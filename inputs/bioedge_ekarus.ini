[source_science]
; central wavelength [nm]
wvl_nm = 1400
; zenithal angle [deg]
zenith_deg = 30

[source_wfs]
; central wavelength [nm]
wvl_nm = 635
; flux [ph/m²/s]
flux = 1e8
; source size [arcsec]
size = 0
; separation distance [arcsec]
separation = 0.
; separation angle [deg]
angle = 0

[pupil]
; diameter [m]
diameter = 1.8
; central obstruction diameter ratio
occultation = 0.3
; number of actuators across diameter
nact = 24
; DM cartesian
cartesian = true
; ratio of number of controlled modes vs total nb of modes
nmode_ratio = 0.9
; NCPA [nm RMS]
ncpa = 20
; jitter [mas RMS]
jitter_mas = 0

[rtc]
; AO loop frequency [Hz]
freq = 1000
; RTC delay [ms]
delay = 1
; integrator gain
ki = 0.5

[bioedgewfs]
; number of lenslet across diameter
lenslet = 41
; readout noise [e-/pix]
ron = 0.3
; is the camera an EMCCD
emccd = true
; throughput
throughput = 0.2
; grey width (diameter) [lambda/D]
grey_width = 0.0
; modulation radius [lambda/D]
modulation_radius = 0.0
; grey length [lambda/D]
grey_length = None
; polarization leakage factor
polarization_leakage_factor = 0.0 

